name: Sync upstream
on:
  schedule:
    # 每天 4 次，每 6 小时一次（北京时间 00:00 / 06:00 / 12:00 / 18:00；时间是 UTC 16:00 / 22:00 / 04:00 / 10:00）
    - cron: '0 22,4,10,16 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Merge upstream main into fork main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Minireel/HGhub.git || true
          git fetch upstream
          git checkout main
          git merge upstream/main --no-edit || {
            echo "::error::Merge conflict with upstream. Resolve it manually (Sync fork on the web or github.dev)."
            exit 1
          }
          git push origin main
          echo "Sync done: $(git rev-parse --short HEAD)"
